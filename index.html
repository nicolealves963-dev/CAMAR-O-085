  /* leve escurecimento no topo para dar leitura ao texto sobre a madeira */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: linear-gradient(to bottom, rgba(40,15,5,.28), rgba(40,15,5,0) 45%);
    pointer-events: none;
  }
  main {
    position: relative;
    width: min(100%, 480px);
    min-height: 100svh;
    margin: 0 auto;
    padding: 28px 24px 32px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .logo { width: clamp(150px, 42vw, 200px); height: auto; filter: drop-shadow(0 4px 10px rgba(0,0,0,.25)); }
  h1 {
    margin-top: 18px;
    font-family: var(--fonte-titulo);
    font-weight: 400;
    font-size: clamp(3.2rem, 15vw, 4.6rem);
    line-height: 1;
    letter-spacing: .01em;
    text-shadow: 0 2px 12px rgba(0,0,0,.3);
  }
  .sub {
    font-weight: 300;
    font-size: clamp(1.8rem, 8.5vw, 2.4rem);
    line-height: 1.1;
    color: var(--creme);
    text-shadow: 0 2px 10px rgba(0,0,0,.3);
  }
  .horario {
    margin-top: 12px;
    font-weight: 300;
    font-size: clamp(.82rem, 3.6vw, 1rem);
    letter-spacing: .22em;
    line-height: 1.9;
    color: var(--creme);
    text-shadow: 0 1px 8px rgba(0,0,0,.45);
  }
  .horario span { display: block; }

  /* botões ficam sobre o prato, como no stories */
  nav {
    width: 100%;
    margin-top: auto;
    padding-top: 44vh;
    display: flex; flex-direction: column; gap: 14px;
  }
  .botao {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px 10px 10px;
    background: var(--madeira);
    color: var(--branco);
    border-radius: 6px;
    text-decoration: none;
    font-size: clamp(1rem, 4.6vw, 1.2rem);
    font-weight: 400;
    text-transform: uppercase;
    text-decoration: underline;
    text-underline-offset: 4px;
    box-shadow: 0 3px 10px rgba(0,0,0,.28);
    transition: background .2s, transform .2s;
  }
  .botao:hover { background: var(--madeira-escura); }
  .botao:active { transform: scale(.98); }
  .botao:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .botao .icone {
    flex: none;
    width: 48px; height: 48px;
    display: grid; place-items: center;
    background: var(--branco);
    border-radius: 50%;
  }
  .botao svg { width: 26px; height: 26px; fill: #111; }
  .botao .texto { flex: 1; text-align: center; padding-right: 48px; }

  .insta {
    margin-top: 40px;
    color: var(--creme);
    text-decoration: none;
    font-weight: 300;
    letter-spacing: .3em;
    font-size: .95rem;
    text-shadow: 0 1px 8px rgba(0,0,0,.6);
  }
  .insta:hover { text-decoration: underline; text-underline-offset: 4px; }
  .insta:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }

  @media (min-width: 700px) {
    main { padding-top: 40px; }
    nav { padding-top: 46vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    .botao { transition: none; }
  }
</style>
